<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Ingreso de Venta</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 40px 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 600px; }
        h2 { color: #2c3e50; margin-top: 0; text-align: center; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-top: 20px; }
        .form-group { text-align: left; }
        .form-group.full-width { grid-column: span 2; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px; }
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; }
        .actions { display: flex; gap: 10px; margin-top: 25px; grid-column: span 2; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; text-align: center; text-decoration: none; font-weight: bold; }
        .btn-submit { background-color: #2ecc71; color: white; }
        .btn-submit:hover { background-color: #27ae60; }
        .btn-cancel { background-color: #7f8c8d; color: white; }
        .btn-cancel:hover { background-color: #95a5a6; }
        .error { color: red; font-size: 14px; margin-bottom: 15px; text-align: center; }
        .computed-field { font-weight: bold; color: #27ae60; background-color: #e8f8f5; }
        .cost-field { font-weight: bold; color: #e67e22; background-color: #fef5e7; }
    </style>
</head>
<body>
    <div class="card">
        <h2>🛒 Registro de Ingreso de Venta</h2>

        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}

        <form action="/ingresar-venta" method="POST">
            <div class="form-grid">
                
                <!-- Cliente -->
                <div class="form-group full-width">
                    <label for="cliente_nombre">CLIENTE *</label>
                    <select id="cliente_nombre" name="cliente_nombre" required>
                        {% for cli in clientes %}
                            <option value="{{ cli.nombre }}">{{ cli.nombre }} (NIT/CC: {{ cli.nit_cedula }})</option>
                        {% endfor %}
                    </select>
                </div>

                <!-- Seleccionar Producto -->
                <div class="form-group full-width">
                    <label for="producto_select">NOMBRE DEL PRODUCTO *</label>
                    <select id="producto_select" onchange="seleccionarProducto()" required>
                        <option value="" disabled selected>-- Seleccione un Producto --</option>
                        {% for prod in productos %}
                            <option value="{{ prod.id }}" data-codigo="{{ prod.codigo }}" data-nombre="{{ prod.nombre }}" data-embalaje="{{ prod.embalaje or '' }}">
                                {{ prod.nombre }} ({{ prod.codigo }})
                            </option>
                        {% endfor %}
                    </select>
                </div>

                <input type="hidden" id="producto_id" name="producto_id">
                <input type="hidden" id="nombre_producto" name="nombre_producto">

                <div class="form-group">
                    <label for="codigo_producto">CÓDIGO DEL PRODUCTO</label>
                    <input type="text" id="codigo_producto" name="codigo_producto" readonly required placeholder="Auto">
                </div>

                <div class="form-group">
                    <label for="embalaje">EMBALAJE</label>
                    <input type="text" id="embalaje" name="embalaje" readonly placeholder="Auto">
                </div>

                <div class="form-group">
                    <label for="cantidad">CANTIDAD *</label>
                    <input type="number" step="0.01" min="0.01" id="cantidad" name="cantidad" placeholder="Ej: 2" required oninput="calcularTotales()">
                </div>

                <div class="form-group">
                    <label for="fecha_venta">FECHA DE VENTA *</label>
                    <input type="date" id="fecha_venta" name="fecha_venta" value="{{ fecha_hoy }}" required>
                </div>

                <div class="form-group">
                    <label for="costo_unitario">COSTO UNITARIO ($) *</label>
                    <input type="number" step="0.01" min="0" id="costo_unitario" name="costo_unitario" placeholder="Ej: 9700" required oninput="calcularTotales()">
                </div>

                <div class="form-group">
                    <label for="precio_unitario">PRECIO UNITARIO ($) *</label>
                    <input type="number" step="0.01" min="0" id="precio_unitario" name="precio_unitario" placeholder="Ej: 11000" required oninput="calcularTotales()">
                </div>

                <div class="form-group">
                    <label for="total_costo">COSTO DE VENTA ($)</label>
                    <input type="text" id="total_costo" class="cost-field" readonly placeholder="$ 0,00">
                </div>

                <div class="form-group">
                    <label for="total_venta">TOTAL VENTA ($)</label>
                    <input type="text" id="total_venta" class="computed-field" readonly placeholder="$ 0,00">
                </div>

                <!-- TIPO DE PAGO -->
                <div class="form-group">
                    <label for="tipo_pago">TIPO DE PAGO *</label>
                    <select id="tipo_pago" name="tipo_pago" onchange="toggleMetodoPago()" required>
                        <option value="CONTADO" selected>CONTADO / PAGO INMEDIATO</option>
                        <option value="CREDITO">CRÉDITO</option>
                    </select>
                </div>

                <!-- MÉTODO / ENTIDAD DE PAGO -->
                <div class="form-group" id="contenedor_entidad">
                    <label for="entidad_pago">MÉTODO / ENTIDAD BANCARIA *</label>
                    <select id="entidad_pago" name="entidad_pago">
                        <option value="Efectivo">Efectivo</option>
                        <option value="Nequi">Nequi</option>
                        <option value="Daviplata">Daviplata</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>

                <div class="actions">
                    <button type="submit" class="btn btn-submit">💾 Guardar Venta</button>
                    <a href="/" class="btn btn-cancel">Cancelar</a>
                </div>
            </div>
        </form>
    </div>

    <script>
        function seleccionarProducto() {
            let select = document.getElementById("producto_select");
            let option = select.options[select.selectedIndex];

            if (option.value !== "") {
                document.getElementById("producto_id").value = option.value;
                document.getElementById("nombre_producto").value = option.getAttribute("data-nombre");
                document.getElementById("codigo_producto").value = option.getAttribute("data-codigo");
                document.getElementById("embalaje").value = option.getAttribute("data-embalaje");
            }
        }

        function calcularTotales() {
            let cant = parseFloat(document.getElementById("cantidad").value) || 0;
            let costoUnit = parseFloat(document.getElementById("costo_unitario").value) || 0;
            let precioUnit = parseFloat(document.getElementById("precio_unitario").value) || 0;

            let costoTotal = cant * costoUnit;
            let ventaTotal = cant * precioUnit;

            document.getElementById("total_costo").value = "$ " + costoTotal.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
            document.getElementById("total_venta").value = "$ " + ventaTotal.toLocaleString('es-CO', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function toggleMetodoPago() {
            let tipoPago = document.getElementById("tipo_pago").value;
            let contenedorEntidad = document.getElementById("contenedor_entidad");
            let entidadPagoSelect = document.getElementById("entidad_pago");

            if (tipoPago === "CONTADO") {
                contenedorEntidad.style.display = "block";
                entidadPagoSelect.required = true;
            } else {
                contenedorEntidad.style.display = "none";
                entidadPagoSelect.required = false;
            }
        }

        window.onload = function() {
            toggleMetodoPago();
        };
    </script>
</body>
</html>
