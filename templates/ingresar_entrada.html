<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrar Nueva Entrada</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 1200px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { color: #2c3e50; margin-top: 0; margin-bottom: 20px; }
        
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; color: #34495e; font-size: 13px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; box-sizing: border-box; }
        input:focus, select:focus { border-color: #2980b9; outline: none; }
        
        .row { display: flex; gap: 15px; }
        .row .form-group { flex: 1; }

        .btn { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; text-decoration: none; font-weight: bold; font-size: 14px; display: inline-flex; align-items: center; gap: 5px; }
        .btn-add { background-color: #27ae60; color: white; margin-top: 10px; }
        .btn-add:hover { background-color: #219653; }
        .btn-submit { background-color: #2980b9; color: white; }
        .btn-submit:hover { background-color: #2471a3; }
        .btn-back { background-color: #7f8c8d; color: white; }
        .btn-back:hover { background-color: #95a5a6; }
        .btn-delete { background-color: #e74c3c; color: white; padding: 5px 10px; font-size: 12px; }
        .btn-delete:hover { background-color: #c0392b; }

        .alert-error { background-color: #e74c3c; color: white; padding: 10px; border-radius: 6px; margin-bottom: 15px; font-size: 14px; }
        
        .table-responsive { width: 100%; overflow-x: auto; margin-top: 25px; margin-bottom: 20px; }
        table { width: 100%; border-collapse: collapse; font-size: 13px; white-space: nowrap; }
        th, td { padding: 10px 8px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #34495e; color: white; text-transform: uppercase; font-size: 11px; }
        tr:hover { background-color: #f1f1f1; }

        .actions-container { display: flex; justify-content: space-between; align-items: center; margin-top: 30px; border-top: 1px solid #eee; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <h2>📥 Registrar Nueva Entrada de Mercancía</h2>

    <div id="errorAlert" class="alert-error" style="display: none;"></div>

    <div class="row">
        <div class="form-group">
            <label for="fecha">Fecha</label>
            <input type="date" id="fecha" value="{{ fecha_hoy }}" required>
        </div>
        <div class="form-group">
            <label for="proveedor">Proveedor</label>
            <input type="text" id="proveedor" placeholder="Nombre del proveedor" required>
        </div>
        <div class="form-group">
            <label for="factura">Factura N°</label>
            <input type="text" id="factura" placeholder="Número de factura">
        </div>
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #eee;">

    <div class="form-group">
        <label for="producto_select">Seleccionar Producto (Código / Nombre)</label>
        <select id="producto_select" onchange="actualizarProducto()">
            <option value="">-- Seleccione un producto --</option>
            {% for p in productos %}
                <option value="{{ p.codigo }}" data-nombre="{{ p.nombre }}" data-embalaje="{{ p.embalaje }}">
                    [{{ p.codigo }}] - {{ p.nombre }} (Embalaje: {{ p.embalaje }})
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Campos ocultos del producto actual -->
    <input type="hidden" id="codigo">
    <input type="hidden" id="producto">
    <input type="hidden" id="embalaje">

    <div class="row">
        <div class="form-group">
            <label for="cant_paquetes">Cantidad Paquetes a Ingresar</label>
            <input type="number" step="any" id="cant_paquetes" placeholder="Ej. 10">
        </div>
        <div class="form-group">
            <label for="costo">Costo (Base)</label>
            <input type="number" step="any" id="costo" placeholder="0.00">
        </div>
        <div class="form-group">
            <label for="tipo_iva">Aplicar IVA (19%)</label>
            <select id="tipo_iva">
                <option value="sin_iva">Sin IVA (Sumar 19%)</option>
                <option value="con_iva">Con IVA Incluido (Valor Neto)</option>
            </select>
        </div>
    </div>

    <button type="button" class="btn btn-add" onclick="agregarProductoTemporal()">➕ Agregar Producto a la Factura</button>

    <!-- Tabla con los productos agregados a esta factura -->
    <div class="table-responsive">
        <h3>Productos en esta Factura:</h3>
        <table id="tablaTemporal">
            <thead>
                <tr>
                    <th>CÓDIGO</th>
                    <th>PRODUCTO</th>
                    <th>EMBALAJE</th>
                    <th>PAQUETES</th>
                    <th>UNIDADES</th>
                    <th>COSTO UNIT. PACA</th>
                    <th>COSTO TOTAL</th>
                    <th>PRECIO SUGERIDO</th>
                    <th style="text-align: center;">ACCIONES</th>
                </tr>
            </thead>
            <tbody>
                <tr id="filaVacia">
                    <td colspan="9" style="text-align: center; color: #7f8c8d;">No hay productos agregados todavía.</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="actions-container">
        <a href="/total-entradas" class="btn btn-back">⬅ Cancelar / Volver</a>
        <button type="button" class="btn btn-submit" onclick="guardarFacturaCompleta()">💾 Guardar Factura Completa</button>
    </div>
</div>

<script>
    let productosTemporal = [];

    function extraerNumeroEmbalaje(embalajeStr) {
        if (!embalajeStr) return 1;
        let match = embalajeStr.match(/(\d+[\.,]?\d*)/);
        return match ? parseFloat(match[0].replace(',', '.')) : 1;
    }

    function actualizarProducto() {
        let select = document.getElementById("producto_select");
        let option = select.options[select.selectedIndex];

        if (option.value) {
            document.getElementById("codigo").value = option.value;
            document.getElementById("producto").value = option.getAttribute("data-nombre");
            document.getElementById("embalaje").value = option.getAttribute("data-embalaje");
        } else {
            document.getElementById("codigo").value = "";
            document.getElementById("producto").value = "";
            document.getElementById("embalaje").value = "";
        }
    }

    function agregarProductoTemporal() {
        let codigo = document.getElementById("codigo").value;
        let producto = document.getElementById("producto").value;
        let embalaje = document.getElementById("embalaje").value;
        let cantPaquetes = parseFloat(document.getElementById("cant_paquetes").value);
        let costoBase = parseFloat(document.getElementById("costo").value);
        let tipoIva = document.getElementById("tipo_iva").value;

        if (!codigo || !cantPaquetes || isNaN(cantPaquetes) || isNaN(costoBase)) {
            alert("Por favor seleccione un producto, ingrese la cantidad de paquetes y el costo.");
            return;
        }

        let factorEmbalaje = extraerNumeroEmbalaje(embalaje);
        let cantUnidades = cantPaquetes * factorEmbalaje;
        let costoPaca = (tipoIva === "sin_iva") ? (costoBase * 1.19) : costoBase;
        let costoTotal = cantPaquetes * costoPaca;
        let precioSugerido = costoPaca * 1.10;

        let item = {
            codigo: codigo,
            producto: producto,
            embalaje: embalaje,
            cant_paquetes: cantPaquetes,
            cant_unidades: cantUnidades,
            costo: costoBase,
            tipo_iva: tipoIva,
            costo_unit_paca: costoPaca,
            costo_total: costoTotal,
            precio_sugerido: precioSugerido
        };

        productosTemporal.push(item);
        renderizarTablaTemporal();
        limpiarFormularioProducto();
    }

    function limpiarFormularioProducto() {
        document.getElementById("producto_select").value = "";
        document.getElementById("codigo").value = "";
        document.getElementById("producto").value = "";
        document.getElementById("embalaje").value = "";
        document.getElementById("cant_paquetes").value = "";
        document.getElementById("costo").value = "";
    }

    function eliminarItem(index) {
        productosTemporal.splice(index, 1);
        renderizarTablaTemporal();
    }

    function renderizarTablaTemporal() {
        let tbody = document.querySelector("#tablaTemporal tbody");
        tbody.innerHTML = "";

        if (productosTemporal.length === 0) {
            tbody.innerHTML = `<tr id="filaVacia"><td colspan="9" style="text-align: center; color: #7f8c8d;">No hay productos agregados todavía.</td></tr>`;
            return;
        }

        productosTemporal.forEach((item, index) => {
            let tr = document.createElement("tr");
            tr.innerHTML = `
                <td>${item.codigo}</td>
                <td><strong>${item.producto}</strong></td>
                <td>${item.embalaje}</td>
                <td style="text-align: center;">${item.cant_paquetes}</td>
                <td style="text-align: center;">${item.cant_unidades.toLocaleString('es-CO', {maximumFractionDigits: 2})}</td>
                <td style="text-align: right;">$ ${item.costo_unit_paca.toLocaleString('es-CO', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td style="text-align: right; color: #d35400; font-weight: bold;">$ ${item.costo_total.toLocaleString('es-CO', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td style="text-align: right; color: #27ae60; font-weight: bold;">$ ${item.precio_sugerido.toLocaleString('es-CO', {minimumFractionDigits: 2, maximumFractionDigits: 2})}</td>
                <td style="text-align: center;"><button type="button" class="btn btn-delete" onclick="eliminarItem(${index})">🗑️ Eliminar</button></td>
            `;
            tbody.appendChild(tr);
        });
    }

    function guardarFacturaCompleta() {
        let fecha = document.getElementById("fecha").value;
        let proveedor = document.getElementById("proveedor").value;
        let factura = document.getElementById("factura").value;
        let errorAlert = document.getElementById("errorAlert");

        if (!fecha || !proveedor) {
            errorAlert.innerText = "Por favor ingrese la Fecha y el Proveedor de la factura.";
            errorAlert.style.display = "block";
            return;
        }

        if (productosTemporal.length === 0) {
            errorAlert.innerText = "Debe agregar al menos un producto a la lista antes de guardar.";
            errorAlert.style.display = "block";
            return;
        }

        errorAlert.style.display = "none";

        let datosEnvio = {
            fecha: fecha,
            proveedor: proveedor,
            factura: factura,
            items: productosTemporal
        };

        fetch('/ingresar-entrada', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(datosEnvio)
        })
        .then(response => response.json().then(data => ({ status: response.status, body: data })))
        .then(result => {
            if (result.status === 200 && result.body.success) {
                window.location.href = result.body.redirect;
            } else {
                errorAlert.innerText = result.body.error || "Ocurrió un error al guardar.";
                errorAlert.style.display = "block";
            }
        })
        .catch(error => {
            errorAlert.innerText = "Error de conexión al guardar la factura.";
            errorAlert.style.display = "block";
        });
    }
</script>

</body>
</html>
